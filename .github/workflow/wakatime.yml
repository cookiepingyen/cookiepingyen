name: Waka Readme
on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 and 18:00 at Taiwan
    - cron: "0 4,10 * * *"
jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
